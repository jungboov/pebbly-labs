<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Pebbly Labs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- [ 00 ] 인트로 글꼴(pebbly 로고와 같은 MuseoModerno) — /00 메인과 같은 글꼴 파일이라 넘어가면 바로 그려짐 -->
  <link href="https://fonts.googleapis.com/css2?family=MuseoModerno:wght@400;500;600&display=block" rel="stylesheet">
  <meta name="description" content="pebbly labs — working on the next number. 01 pebbly remover · 03 pebbly mirror.">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <!-- [ 00 ] 아이콘 — _brand/icons/make.js 00로 뽑음. ?v=는 파일 내용 해시 -->
  <link rel="icon" href="/favicon.ico?v=a4e32cc1" sizes="32x32">
  <link rel="icon" href="/favicon.svg?v=1b94116b" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=d145928b">
  <!-- 홈 화면에 추가할 때 이름: 안드로이드는 manifest의 short_name, 아이폰은 apple-mobile-web-app-title -->
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="application-name" content="Pebbly Labs">
  <meta name="apple-mobile-web-app-title" content="Pebbly Labs">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://pebblylabs.com">
  <meta property="og:title" content="pebbly labs">
  <meta property="og:description" content="Working on the next number — 01 pebbly remover · 03 pebbly mirror.">
  <meta property="og:image" content="https://pebblylabs.com/og-image.png?v=176157f1">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:site_name" content="pebbly labs">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:url" content="https://pebblylabs.com">
  <meta name="twitter:title" content="pebbly labs">
  <meta name="twitter:description" content="Working on the next number — 01 pebbly remover · 03 pebbly mirror.">
  <meta name="twitter:image" content="https://pebblylabs.com/og-image.png?v=176157f1">

  <link rel="prefetch" href="/00">
  <!-- 스크립트가 안 돌면 바로 메인으로, 멈춰도 8초 뒤 메인으로 -->
  <noscript><meta http-equiv="refresh" content="0; url=/00"></noscript>
  <meta http-equiv="refresh" content="8; url=/00">
  <style>
    /* ───── [ 00 ] 인트로 (pebbly 번호 인트로 부품 — 모양·움직임·스타일은 pebbly-intro.js, 미러 시작 화면과 같은 부품) ─────
       [ 00 ] 상자 → 스파인으로 펼쳐짐 → 숫자 릴이 한 바퀴(100칸) 돌아 00에 멈춤 → /00 메인이 로고를 이어받음 */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; background: #000; overflow: hidden; }
    .skip { position: fixed; left: -9999px; }
    .skip:focus { left: 16px; top: 16px; z-index: 1001; color: #fff; font: 14px sans-serif; }
  </style>
</head>

<body>
  <a class="skip" href="/00">pebbly labs — main page</a>
  <!-- [ 00 ] 인트로: 들어올 때마다(약 4초) — 끝나거나 누르거나 키를 누르면 /00 메인으로. 움직임 줄이기를 켠 기기는 다 펼친 모습만 잠깐 -->
  <div id="pi" aria-hidden="true"></div>
  <!-- 부품 사본 — 원본은 D:\workspace\pebbly\_brand\intro\pebbly-intro.js. 여기서 고치지 말고 원본을 고친 뒤 _brand/intro/sync.py -->
  <script src="/pebbly-intro.js?v=8aa45e44"></script>
  <script>
    // 끝까지 보면(keep): 멈춘 로고를 남긴 채 넘어감 — /00이 같은 자리에 로고를 띄워 이어받고 제자리로 줄여 옮김(pebbly-handoff)
    // 누르거나 키로 넘기면: 사라진 뒤 넘어감(/00은 그냥 뜸). 부품을 못 받으면 바로 메인으로
    const MAIN = '/00' + location.search;
    if (window.pebblyIntro) pebblyIntro(document.getElementById('pi'), { no: 0, name: 'pebbly labs', keep: true, onDone: r => {
      if (!(r && r.skipped)) try { sessionStorage.setItem('pebbly-handoff', Date.now()); } catch (e) {}
      location.replace(MAIN);
    } }).play();
    else location.replace(MAIN);
    // 서비스 워커(sw.js): 홈 화면에 앱으로 설치되게 — 없으면 바로가기로만 만들어져 시작 화면이 흰 바탕
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
  </script>
</body>
</html>
